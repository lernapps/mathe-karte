name: Pages

# Baut die Site (explainer und Karte, vite.config.ts) und liefert sie über GitHub Pages aus:
# https://lernapps.github.io/mathe-karte/. Die Architektur ist die gemeinsame des explainers (README).
# Pages-Quelle muss "GitHub Actions" sein. Achtung: Ein Repo <org>.github.io schaltet Pages beim Anlegen
# automatisch im Branch-Modus ein; umstellen mit
#   gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
