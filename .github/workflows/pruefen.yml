name: Prüfen

# Tests und Build (inkl. Build-Prüfungen) bei jedem Push und Pull Request: der explainer (vite-plus: Format, Lint mit
# den Regeln von lernapps.net, Typen, Vue-Komponenten) und der JavaScript-Teil (Karte, lib/, scripts/: ESLint, node:test).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-und-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Volle Abhängigkeitsliste prüfen, nicht --omit=dev: Die Site hat keine Laufzeit-Abhängigkeiten,
      # alles ist devDependency und läuft im Build, der das ausgelieferte HTML erzeugt (Supply Chain).
      # Bricht bei high/critical ab; Ausnahmen nur mit Grund und Ablaufdatum in scripts/audit.js (ADR-033).
      - run: npm run audit
      - run: npm run lint
      # vp check (Format, Lint, typgeprüft) über src/ und vue-tsc über die Vue-Komponenten (ADR-033).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
