name: Browser-Tests

# TD-5 (#26): lernapps check, die Prüfung von lernapps.net (ADR-033): Format, Lint, Typen, Unit-Tests, Build, die
# Plattform-Regeln über das gebaute dist/ und alle Browser-Tests (playwright.config.ts): die des explainers
# (e2e/explainer.e2e.ts) und die eigenen über alle Seiten samt Karte (axe, externe Anfragen, 360 px, ohne JS).
# Pflicht-Check "browser".
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Browser-Cache hängt an der gepinnten Playwright-Version; Systembibliotheken kommen immer per apt.
      - name: Playwright-Version ermitteln
        id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium installieren
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Systembibliotheken für Chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium

      - run: npx --no-install lernapps check
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-bericht
          path: |
            test-results/
            node_modules/.cache/lernapps/
          retention-days: 14
