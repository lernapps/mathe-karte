# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Baumdiagramm
description: Ein Baumdiagramm zu einem mehrstufigen Zufallsversuch zeichnen, mit den Wahrscheinlichkeiten an den Zweigen, mit und ohne Zurücklegen.
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Sobald du zweimal ziehst, wirfst oder würfelst, wird es unübersichtlich: Was kann beim ersten Mal passieren, was danach? Das Baumdiagramm ordnet alle Möglichkeiten Stufe für Stufe. Mit einem sauberen Baum lösen sich die Pfadregeln fast von allein – ohne Baum verliert man schnell einen Fall.
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: definition
        term: mehrstufiger Zufallsversuch
        explanation: >-
          Ein Zufallsversuch aus mehreren Zügen (Stufen), zum Beispiel zweimal aus einer Urne ziehen oder dreimal eine Münze werfen.
      - type: text
        text: Für jede Stufe zeichnest du **Zweige** zu allen möglichen Ergebnissen.
      - type: text
        text: |-
          - An jeden Zweig schreibst du seine **Wahrscheinlichkeit** (Laplace: günstig durch möglich).
          - Die Zweige an einem Knoten ergeben zusammen immer **1**.
          - Reihenfolge beim Zeichnen: erst alle Zweige, dann die Kugeln, dann die Brüche.
          - **Ohne Zurücklegen** ändern sich ab der zweiten Stufe Zähler und Nenner (mehr dazu unter
            [Ohne Zurücklegen](/zufall/ohne-zuruecklegen/)).
      - type: formula
        formula: 'P(\text{Zweig 1}) + P(\text{Zweig 2}) + \text{…} = 1'
      - type: definition
        term: Pfad
        explanation: Ein Weg im Baumdiagramm vom Start bis zu einem Ende.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Zweimal ziehen ohne Zurücklegen
        blocks:
          - type: text
            text: >-
              In einer Urne liegen 3 rote und 2 blaue Kugeln. Du ziehst zweimal **ohne Zurücklegen**. Das Bild unten zeigt den fertigen Baum.
          - type: text
            text: |-
              1. **1. Stufe:** 5 Kugeln. $P(\text{rot}) = \frac{3}{5}$, $P(\text{blau}) = \frac{2}{5}$. Zusammen 1.
              2. **2. Stufe nach rot:** nur noch 4 Kugeln, davon 2 rote. $P(\text{rot}) = \frac{2}{4}$,
                 $P(\text{blau}) = \frac{2}{4}$.
              3. **2. Stufe nach blau:** 4 Kugeln, 3 rote, 1 blaue. $P(\text{rot}) = \frac{3}{4}$,
                 $P(\text{blau}) = \frac{1}{4}$.
              4. Unter den Enden stehen schon die Pfadwahrscheinlichkeiten (siehe
                 [1. Pfadregel](/zufall/pfadregel-1/)). Ihre Summe ist 1 – ein guter Test für jeden Baum.
  - type: section
    id: bild
    title: Bild
    blocks:
      - type: figure
        image: images/zufall-baumdiagramm.svg
        alt: Baumdiagramm zur Urne mit 3 roten und 2 blauen Kugeln, zweimal ohne Zurücklegen
        caption: |-
          Ein Baumdiagramm zur Urne mit 3 roten (R) und 2 blauen (B) Kugeln, zweimal ohne Zurücklegen. Vom Start
          gehen zwei Zweige aus: rot mit 3/5 und blau mit 2/5. Nach rot folgen rot mit 2/4 und blau mit 2/4, nach blau
          folgen rot mit 3/4 und blau mit 1/4. Unter den vier Enden stehen die Pfadwahrscheinlichkeiten:
          rot-rot 3/10, rot-blau 3/10, blau-rot 3/10, blau-blau 1/10. Zusammen ergeben sie 1.
        source: Eigene Darstellung der Mathe-Karte
        licence: MIT
  - type: section
    id: video
    title: Video dazu
    blocks:
      - type: video
        youtube: mBknBnww5fA
        title: "Baumdiagramm | mehrstufiger Zufallsversuch | Wahrscheinlichkeit | Stochastik"
        channel: Lehrerschmidt
      - type: text
        text: |-
          - Noch eine Erklärung: [Mehrstufige Zufallsexperimente](https://de.serlo.org/mathe/156048/mehrstufige-zufallsexperimente) bei serlo.org
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: vue-component
        id: baum-ergaenzen
        component: ZufallBaumLuecken
        examples:
          accepted:
            - { answer: { a: "1/2", b: "1/2", c: "1/2" }, seed: 1 }
            - { answer: { a: "0,5", b: "50 %", c: "2/4" }, seed: 1 }
          rejected:
            - { answer: { a: "1/2", b: "1/2", c: "1/3" }, seed: 1 }
            - { answer: {} }
      - type: generated
        id: baumdiagramm-nenner
        given:
          r: { int: [2, 6] }
          b: { int: [2, 5] }
        task:
          text: >-
            In einer Urne liegen {{r}} rote und {{b}} blaue Kugeln. Du ziehst zweimal ohne Zurücklegen. Welcher Nenner steht an den Zweigen der zweiten Stufe?
        answer: { value: "r + b - 1", compare: { number: { format: integer } } }
        mistakes:
          - value: "r + b"
            message: "Das ist der Nenner der ersten Stufe. Ohne Zurücklegen fehlt beim zweiten Zug eine Kugel."
          - value: "r + b - 2"
            message: "Es fehlt nur die eine Kugel, die du beim ersten Zug gezogen hast: Der Nenner wird um 1 kleiner."
        hint: "Wie viele Kugeln liegen noch in der Urne, nachdem du eine gezogen hast?"
        steps:
          - "Am Anfang liegen {{r}} + {{b}} Kugeln in der Urne."
          - "Nach dem ersten Zug fehlt eine Kugel: Der Nenner der zweiten Stufe ist {{answer}}."
