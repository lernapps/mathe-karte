# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Geschickt rechnen
description: "Geschickt rechnen mit den binomischen Formeln: 49², 21 · 19 und 102² im Kopf. Erklärung, Flächenbild mit Zahlen, Video und Übungsaufgaben mit Sofort-Feedback."
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Die binomischen Formeln sind nicht nur für Buchstaben da. Mit ihnen rechnest du Aufgaben wie $49^2$ oder $21 \cdot 19$ im Kopf aus – schneller als mit dem schriftlichen Verfahren. Das hilft beim Kopfrechnen, beim Überschlagen und in der Klassenarbeit ohne Taschenrechner. Und es zeigt dir, dass die Formeln wirklich für jede Zahl gelten: Buchstaben sind nur Platzhalter.
      - type: vue-component
        component: KarteVerweis
        props:
          knoten: klammern-binome
          text: Wo das im Lehrplan deines Bundeslandes steht, zeigt die
          link: Lehrplan-Karte.
        nojs: Wo das im Lehrplan deines Bundeslandes steht, zeigt die [Lehrplan-Karte](https://lernapps.net/mathe-karte/karte/?knoten=klammern-binome).
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: formula
        formula: "49^2 = (50 - 1)^2 = 2500 - 100 + 1 = 2401"
      - type: text
        text: >-
          Zerlege die Zahl in eine **glatte Zahl** (Zehner oder Hunderter) und einen kleinen Rest. Liegt sie knapp darüber, nimmst du die 1. Formel $(a + b)^2$, knapp darunter die 2. Formel $(a - b)^2$. Zwei Zahlen, die gleich weit links und rechts von einem Zehner liegen, rechnest du mit der 3. Formel: $21 \cdot 19 = (20 + 1)(20 - 1)$ $= 20^2 - 1^2$.
      - type: text
        text: "Mit der glatten Zahl kannst du leicht rechnen: $50^2 = 2500$, $2 \\cdot 50 \\cdot 1 = 100$, $1^2 = 1$."
      - type: note
        title: Merke
        blocks:
          - type: text
            text: "Das Mittelglied nicht vergessen! $49^2$ ist nicht $2500 - 1 = 2499$."
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: "Rechne im Kopf: 102² und 21 · 19"
        blocks:
          - type: table
            caption: "Die Rechenwege für 102² und 21 · 19"
            rowHeaders: true
            rows:
              - ["Zerlegen", "$102 = 100 + 2$ → 1. Formel"]
              - ["Formel", "$100^2 + 2 \\cdot 100 \\cdot 2 + 2^2$ $= 10000 + 400 + 4$"]
              - ["Ergebnis", "**$102^2 = 10404$**"]
              - ["Zerlegen", "$21 \\cdot 19 = (20 + 1)(20 - 1)$ → 3. Formel"]
              - ["Formel", "$20^2 - 1^2 = 400 - 1$"]
              - ["Ergebnis", "**$21 \\cdot 19 = 399$**"]
  - type: section
    id: bild
    title: Bild
    blocks:
      - type: figure
        image: images/binom-geschickt-rechnen.svg
        alt: 49² = 2401. 50² − zwei Streifen + Ecke zurück
        caption: "$49^2$ als Fläche: Ein Quadrat mit der Seite $50$, also $50^2 = 2500$. Rechts und unten ist je ein Streifen $50 \\cdot 1 = 50$ markiert (rot): Beide werden abgezogen. Die grüne Ecke $1^2 = 1$ steckt in beiden Streifen, ist also doppelt abgezogen und kommt einmal zurück. Übrig bleibt das Quadrat $49^2$: $2500 - 100 + 1 = 2401$."
        source: Eigene Darstellung der Mathe-Karte
        licence: MIT
  - type: section
    id: video
    title: Video dazu
    blocks:
      - type: video
        youtube: LoTVgi5tYsQ
        title: "Nur für NERDS: Kopfrechnen mit den binomischen Formeln!"
        channel: Lehrerschmidt
      - type: text
        text: >-
          Zum Nachlesen: [Exkurs: Kopfrechnen mit binomischen Formeln bei Serlo](https://de.serlo.org/mathe/18631/ueberblick-zu-den-binomischen-formeln#19104).
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: geschickt-zerlegen
        text: Welche Rechnung passt zu 49²?
        options:
          - text: "49 = 50 - 1, also 50² - 2 · 50 · 1 + 1²"
            correct: true
            info: "Das ist die 2. Formel: 2500 - 100 + 1 = 2401."
          - text: "49 = 50 - 1, also 50² - 1²"
            correct: false
            info: "Hier fehlt das Mittelglied -2 · 50 · 1 = -100. 2500 - 1 = 2499 ist zu groß."
          - text: "49 = 50 - 1, also 50² + 2 · 50 · 1 + 1²"
            correct: false
            info: "Das ist 51² = (50 + 1)². Bei (50 - 1)² ist das Mittelglied negativ."
          - text: "49 = 40 + 9, also 40² + 9²"
            correct: false
            info: "Hier fehlt das Mittelglied 2 · 40 · 9. Außerdem rechnet es sich mit 50 - 1 viel leichter."
        explanation: >-
          49 = 50 - 1, also 49² = (50 - 1)² = 50² - 2 · 50 · 1 + 1² = 2500 - 100 + 1 = 2401.
        links:
          - title: Kopfrechnen mit binomischen Formeln (Serlo)
            url: "https://de.serlo.org/mathe/18631/ueberblick-zu-den-binomischen-formeln#19104"
      - type: vue-component
        id: geschickt-ueben
        component: BinomKopfrechnen
        props:
          frage: "Rechne geschickt im Kopf:"
          frageFormel: Welche Formel hilft?
          pruefen: Prüfen
          loesungZeigen: Lösung zeigen
          tipp: Tipp
          rechenweg: "Lösung:"
        examples:
          accepted:
            - { answer: { formel: "1", ergebnis: "2601" }, seed: 1 }
            - { answer: { formel: "1", ergebnis: " 2601 " }, seed: 1 }
            - { answer: { formel: "3", ergebnis: "6391" }, seed: 3 }
          rejected:
            - { answer: { formel: "1", ergebnis: "2501" }, seed: 1 }
            - { answer: { formel: "2", ergebnis: "2601" }, seed: 1 }
            - { answer: { formel: "", ergebnis: "2601" }, seed: 1 }
            - { answer: { formel: "3", ergebnis: "6409" }, seed: 3 }
