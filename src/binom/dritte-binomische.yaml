# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Dritte binomische Formel
description: "Die dritte binomische Formel (a + b)(a − b) = a² − b²: Erklärung mit Flächenbild zum Umlegen, Beispiel, Video und Übungsaufgaben mit Sofort-Feedback."
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Die dritte Formel ist die kürzeste: Aus $(x + 4)(x - 4)$ wird sofort $x^2 - 16$, ganz ohne Mittelglied. Du brauchst sie ständig, um Terme zu vereinfachen und später, um Differenzen wie $x^2 - 16$ wieder in Klammern zu zerlegen. Und sie ist ein starker Kopfrechentrick: $21 \cdot 19 = 20^2 - 1^2 = 399$.
      - type: vue-component
        component: KarteVerweis
        props:
          knoten: klammern-binome
          text: Wo das im Lehrplan deines Bundeslandes steht, zeigt die
          link: Lehrplan-Karte.
        nojs: Wo das im Lehrplan deines Bundeslandes steht, zeigt die [Lehrplan-Karte](https://lernapps.github.io/mathe-karte/karte/?knoten=klammern-binome).
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: formula
        formula: "(a + b)(a - b) = a^2 - b^2"
      - type: text
        text: >-
          Zwei Klammern mit denselben Gliedern, einmal mit Plus, einmal mit Minus. Beim Ausmultiplizieren entstehen $+ab$ und $-ab$. Sie **heben sich auf**, deshalb gibt es kein Mittelglied. Übrig bleiben $a^2$ und $-b^2$.
      - type: text
        text: "Die Reihenfolge der Klammern ist egal: $(a - b)(a + b)$ ergibt genauso $a^2 - b^2$."
      - type: note
        title: Merke
        blocks:
          - type: text
            text: "Kein Mittelglied – und das Minus bleibt: $a^2 - b^2$, nicht $a^2 + b^2$."
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: "Multipliziere aus: (x + 4)(x − 4)"
        blocks:
          - type: table
            caption: "Der Rechenweg für (x + 4)(x − 4)"
            rowHeaders: true
            rows:
              - ["Glieder", "$a = x$, $b = 4$"]
              - ["Vier Produkte", "$x^2 - 4x + 4x - 16$ – die Mittelglieder heben sich auf"]
              - ["Formel", "$x^2 - 4^2$"]
              - ["Ausgerechnet", "**$x^2 - 16$**"]
          - type: text
            text: "Mit Zahlen davor: $(3a + 2b)(3a - 2b)$ $= 9a^2 - 4b^2$."
  - type: section
    id: bild
    title: Bild
    blocks:
      - type: figure
        image: images/binom-dritte-binomische.svg
        alt: (x + 4)(x − 4) = x² − 16. Gleiche Teile, gleiche Fläche
        caption: "Oben: das Quadrat $x^2$, aus dem rechts unten die Ecke $4^2 = 16$ fehlt (gestrichelt). Der Rest besteht aus zwei Teilen: einem blauen Rechteck $x$ mal $x - 4$ und einem gelben Rechteck $x - 4$ mal $4$. Unten: Das gelbe Teil ist gedreht und rechts angelegt – jetzt ist es ein Rechteck mit den Seiten $x + 4$ und $x - 4$. Gleiche Teile, gleiche Fläche: $(x + 4)(x - 4) = x^2 - 16$."
        source: Eigene Darstellung der Mathe-Karte
        licence: MIT
  - type: section
    id: video
    title: Video dazu
    blocks:
      - type: text
        text: >-
          [3.binomische Formel – ganz einfach erklärt mit Beispielen!](https://www.youtube.com/watch?v=6ySWeEhTOt4), ein Video von Lehrerschmidt auf YouTube. Zum Nachlesen: [Binomische Formeln bei Serlo](https://de.serlo.org/mathe/1499/binomische-formeln).
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: dritte-binomische-erkennen
        text: Jemand rechnet (a + 7)(a - 7) = a² - 14a - 49. Was ist daran falsch?
        options:
          - text: "Es gibt kein Mittelglied: +7a und -7a heben sich auf."
            correct: true
            info: "Richtig ist (a + 7)(a - 7) = a² - 7a + 7a - 49 = a² - 49."
          - text: "Das letzte Glied muss +49 heißen."
            correct: false
            info: "Das letzte Produkt ist (+7) · (-7) = -49. Das Minus bleibt."
          - text: "Das letzte Glied muss -14 heißen."
            correct: false
            info: "Das letzte Glied ist 7² = 7 · 7 = 49, nicht 2 · 7."
        explanation: "Nach der dritten binomischen Formel ist (a + 7)(a - 7) = a² - 7² = a² - 49."
        links:
          - { title: Binomische Formeln (Serlo), url: "https://de.serlo.org/mathe/1499/binomische-formeln" }
      - type: vue-component
        id: dritte-binomische-ueben
        component: BinomTermAufgabe
        props:
          art: dritte
          pruefen: Prüfen
          loesungZeigen: Lösung zeigen
          tipp: Tipp
          rechenweg: "Lösung:"
        examples:
          accepted:
            - { answer: "x^2-36", seed: 1 }
            - { answer: "-36 + x²", seed: 1 }
            - { answer: "9a^2-16", seed: 2 }
          rejected:
            - { answer: "x^2+36", seed: 1 }
            - { answer: "x^2+12x-36", seed: 1 }
            - { answer: "(x+6)(x-6)", seed: 1 }
            - { answer: "3a^2-16", seed: 2 }
