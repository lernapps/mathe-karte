# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Grundwert berechnen
description: "Den Grundwert berechnen mit $G = \\frac{W \\cdot 100}{p}$: Erklärung, Beispiel, Hunderterfeld und Übungsaufgaben."
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          „Du sparst 30 €, das sind 12 % Rabatt“ – wie teuer war die Sache vorher? Hier ist das Ganze unbekannt, und
          genau das verwirrt viele. Wenn du den Grundwert sicher zurückrechnen kannst, löst du auch die kniffligen
          Aufgaben in der Klassenarbeit, bei denen nur der Teil bekannt ist.
      - type: vue-component
        component: KarteVerweis
        props:
          knoten: prozent-grundwert
          text: Wo das im Lehrplan deines Bundeslandes steht, zeigt die
          link: Lehrplan-Karte.
        nojs: Wo das im Lehrplan deines Bundeslandes steht, zeigt die [Lehrplan-Karte](https://lernapps.github.io/mathe-karte/karte/?knoten=prozent-grundwert).
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: formula
        formula: 'G = \frac{W \cdot 100}{p}'
      - type: text
        text: >-
          Der **Grundwert** $G$ ist das Ganze. Du kennst den **Prozentwert** $W$ (den Teil) und den **Prozentsatz**
          $p\,\%$. Über 1 % kommst du zum Ganzen: $W$ geteilt durch $p$ ist 1 %, mal 100 ist das Ganze.
      - type: note
        title: Achtung
        blocks:
          - type: text
            text: >-
              Der Grundwert ist (bei $p$ unter 100 %) immer größer als der Prozentwert. Kommt etwas Kleineres heraus,
              hast du die Formel für den Prozentwert benutzt.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Der Preis eines Rollers
        blocks:
          - type: text
            text: Beim Kauf eines Rollers sparst du 30 €. Das sind 12 % Rabatt. Wie viel hat der Roller vorher gekostet?
          - type: table
            caption: Die Größen im Beispiel und die Rechnung
            rowHeaders: true
            rows:
              - ["Prozentwert $W$", "30 € (der Teil, der bekannt ist)"]
              - ["Prozentsatz $p$", "12 %"]
              - ["Rechnung", "$G = \\frac{30 \\cdot 100}{12} = 250$"]
              - ["Grundwert $G$", "**250 €** war der alte Preis"]
          - type: text
            text: "Über 1 %: 30 € : 12 = 2,50 € sind 1 %. Dann 2,50 € · 100 = 250 €."
  - type: section
    id: bild
    title: Bild
    blocks:
      - type: figure
        draw: { kind: hundred-grid, filled: 12 }
        alt: Ein Hunderterfeld aus 100 Kästchen; 12 Kästchen sind blau.
        caption: >-
          Die 12 blauen Kästchen sind der bekannte Teil: 12 % = 30 €, also ist ein Kästchen 2,50 €. Alle 100 Kästchen
          stehen für den Grundwert: 100 · 2,50 € = 250 €.
  - type: section
    id: video
    title: Video dazu
    blocks:
      - type: text
        text: >-
          [Grundwert berechnen - Prozentrechnung mit Formel - Mathematik einfach erklärt |
          Lehrerschmidt](https://www.youtube.com/watch?v=gtEAmp8-K-8) vom Kanal Lehrerschmidt. Der Link öffnet YouTube;
          vorher lädt diese Seite nichts von dort.
      - type: text
        text: >-
          Noch eine Erklärung in anderen Worten: [Prozentrechnung mittels
          Formeln](https://de.serlo.org/mathe/2193/prozentrechnung-mittels-formeln) bei serlo.org.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: vue-component
        id: grundwert-aufgabe
        component: ProzentGrundwert
        examples:
          accepted:
            - { answer: { grundwert: "20" }, seed: 1 }
            - { answer: { grundwert: "17*100/85" }, seed: 1 }
            - { answer: { grundwert: "80" }, seed: 2 }
          rejected:
            - { answer: { grundwert: "14,45" }, seed: 1 }
            - { answer: { grundwert: "0,2" }, seed: 1 }
            - { answer: { grundwert: "" } }
      - type: generated
        id: grundwert-rechnen
        practice: Und jetzt ohne Geschichte, nur die Rechnung.
        given:
          W: { int: [3, 600] }
          p: { oneOf: [2, 4, 5, 8, 12, 12.5, 15, 20, 24, 25, 30, 40, 45, 60, 75, 80] }
        where: ["decimals(W * 100 / p) <= 2"]
        task:
          text: "{{W}} € sind {{p}} % eines Betrags. Wie groß ist der ganze Betrag?"
        answer: { value: "W * 100 / p", compare: { number: { format: money } } }
        mistakes:
          - {
              value: "W * p / 100",
              message: "Du hast {{p}} % vom Prozentwert berechnet. Gesucht ist aber das Ganze, von dem {{W}} € ein Teil sind.",
            }
          - { value: "W / p", message: "Das ist erst 1 %. Jetzt noch mal 100 nehmen, dann hast du das Ganze." }
        hint: "Rechne erst 1 % aus: {{W}} € geteilt durch {{p}}. Dann mal 100."
        steps:
          - '$G = \frac{W \cdot 100}{p}$'
          - '$G = \frac{{{W}} \cdot 100}{{{p}}} = {{answer}}$, also {{answer}} €.'
